{% extends 'base.html' %}
{% block content %}

<div class="container mt-5">
    <div class="row">

        <!-- Image -->
        <div class="col-md-5">
            {% if product.product_image %}
                <img src="{{ product.product_image.url }}" class="img-fluid">
            {% else %}
                <img src="https://via.placeholder.com/400x300" class="img-fluid">
            {% endif %}
        </div>

        <!-- Details -->
        <div class="col-md-7">
            <h2>{{ product.name }}</h2>
            <h4 class="text-success">₹{{ product.price }}</h4>

            <p class="mt-3">
                {{ product.description|default:"No description available" }}
            </p>

            {% if product.stock > 0 %}
                <a href="{% url 'add_to_cart' product.id %}" class="btn btn-success mt-3">
                    Add to Cart
                </a>
            {% else %}
                <p class="text-danger mt-3">Out of Stock</p>
            {% endif %}
        </div>

    </div>
</div>

{% endblock %}
